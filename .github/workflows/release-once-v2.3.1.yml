name: One-off Release v2.3.1

on:
  push:
    branches:
      - "release/2.3.1-artifacts"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            artifact_name: agy-proxy-linux-amd64
            asset_name: agy-proxy-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact_name: agy-proxy-linux-arm64
            asset_name: agy-proxy-linux-arm64.tar.gz
          - os: windows-latest
            arch: amd64
            artifact_name: agy-proxy-windows-amd64
            asset_name: agy-proxy-windows-amd64.zip
          - os: macos-latest
            arch: arm64
            artifact_name: agy-proxy-darwin-arm64
            asset_name: agy-proxy-darwin-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build standalone executable
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: python build_binary.py

      - name: Package Linux and macOS
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf "../${{ matrix.asset_name }}" agy-proxy

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path agy-proxy.exe -DestinationPath "../${{ matrix.asset_name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  package-python:
    name: Build Python Wheel and SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [build, package-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
      - name: Prepare checksums
        run: |
          mkdir -p final_assets
          find release_assets/ -type f -exec mv -t final_assets/ {} +
          cd final_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish v2.3.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.1
          target_commitish: a64fe422ce03b8a3d3994569499cb6772fa99dc8
          name: agy-proxy v2.3.1
          generate_release_notes: true
          files: final_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
